name: Update shorts from YouTube

on:
  schedule:
    - cron: "0 */4 * * *"   # checks the channel every 4 hours
  workflow_dispatch: {}      # adds a "Run workflow" button under the Actions tab for manual runs

permissions:
  contents: write

jobs:
  update-shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest shorts
        run: node fetch-shorts.mjs

      - name: Commit changes if anything new was found
        run: |
          git config user.name "powerplay-bot"
          git config user.email "actions@github.com"
          git add shorts.json
          git diff --cached --quiet || git commit -m "Auto-update shorts from YouTube"
          git push
